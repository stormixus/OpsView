name: Relay image

# Builds + pushes the relay Docker image (:latest) on relay-affecting pushes to
# master — so the relay can be deployed without cutting a project version tag
# (which would also rebuild the agent + viewer). Full versioned releases still go
# through release.yml on a v* tag.
on:
  push:
    branches: [master]
    paths:
      - "relay/**"
      - "proto/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch: {}

jobs:
  build-relay-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Version label
        id: ver
        run: echo "version=master-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/opsview-relay:latest
            ghcr.io/${{ github.repository_owner }}/opsview-relay:${{ steps.ver.outputs.version }}
