    // --- Cell expand on double-click (motion tween) ---
    let expandedOverlay = null;
    let expandedSourceCell = null;
    let expandedTimer = null;
    let expandedVideoOriginalParent = null;

    function expandCell(chNum, chName, grid, cellEl) {
      collapseCell(true); // instant collapse if already expanded

      // Shrink all other cells
      grid.querySelectorAll('.cctv-cell').forEach(c => {
        if (c !== cellEl) c.classList.add('cell-shrink');
      });

      // Create/reuse overlay
      let overlay = grid.querySelector('.cctv-expand-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'cctv-expand-overlay';
        overlay.addEventListener('dblclick', () => collapseCell());
        grid.appendChild(overlay);
      }

      // Position overlay exactly at the cell's current window viewport coordinates (since it's fixed now)
      const cellRect = cellEl.getBoundingClientRect();
      overlay.style.transition = 'none';
      overlay.style.left = cellRect.left + 'px';
      overlay.style.top = cellRect.top + 'px';
      overlay.style.width = cellRect.width + 'px';
      overlay.style.height = cellRect.height + 'px';
      overlay.style.display = 'flex';
      overlay.classList.remove('active');

      const isRTSP = !!cellEl.querySelector('video');

      if (isRTSP) {
        // Move live video to overlay (keeps HLS connection alive)
        const video = cellEl.querySelector('video');
        expandedVideoOriginalParent = cellEl;
        overlay.innerHTML = '';
        overlay.appendChild(video);
        const label = document.createElement('div');
        label.className = 'expand-label';
        label.innerHTML = '<span class="expand-name">' + escapeHtml(chName) + ' (CH' + chNum + ')</span><span class="expand-hint">' + t('expandHint') + '</span>';
        overlay.appendChild(label);
      } else {
        // ISAPI: snapshot image with refresh
        expandedVideoOriginalParent = null;
        overlay.innerHTML = '<img><div class="expand-label"><span class="expand-name"></span><span class="expand-hint">' + t('expandHint') + '</span></div>';
        const img = overlay.querySelector('img');
        img.src = '/cctv/snapshot/' + activeDvrId + '/' + chNum + '?upscale=2&ai=1&t=' + Date.now();
        overlay.querySelector('.expand-name').textContent = chName + ' (CH' + chNum + ')';

        const dvr = dvrs.find(d => d.id === activeDvrId);
        const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;
        if (expandedTimer) clearInterval(expandedTimer);
        expandedTimer = setInterval(() => {
          const preload = new Image();
          preload.onload = () => { img.src = preload.src; };
          preload.src = '/cctv/snapshot/' + activeDvrId + '/' + chNum + '?upscale=2&ai=1&t=' + Date.now();
        }, refreshMs);
      }

      // Animate to full grid on next frame
      requestAnimationFrame(() => {
        overlay.style.transition = '';
        overlay.classList.add('active');
      });

      expandedOverlay = overlay;
      expandedSourceCell = cellEl;
    }

    function collapseCell(instant) {
      if (expandedTimer) { clearInterval(expandedTimer); expandedTimer = null; }
      if (!expandedOverlay) return;

      const overlay = expandedOverlay;
      const cellEl = expandedSourceCell;
      const grid = overlay.parentElement;

      // Un-shrink other cells
      grid.querySelectorAll('.cctv-cell.cell-shrink').forEach(c => {
        c.classList.remove('cell-shrink');
      });

      // Move video back to original cell if RTSP
      if (expandedVideoOriginalParent) {
        const video = overlay.querySelector('video');
        if (video && expandedVideoOriginalParent.isConnected) {
          const label = expandedVideoOriginalParent.querySelector('.ch-label');
          expandedVideoOriginalParent.insertBefore(video, label);
        }
        expandedVideoOriginalParent = null;
      }

      if (instant || !cellEl) {
        overlay.style.display = 'none';
        overlay.classList.remove('active');
        expandedOverlay = null;
        expandedSourceCell = null;
        return;
      }

      // Animate back to cell position using viewport absolute metrics
      const cellRect = cellEl.getBoundingClientRect();
      overlay.classList.remove('active');
      overlay.style.left = cellRect.left + 'px';
      overlay.style.top = cellRect.top + 'px';
      overlay.style.width = cellRect.width + 'px';
      overlay.style.height = cellRect.height + 'px';

      // Hide after animation completes
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 480);

      expandedOverlay = null;
      expandedSourceCell = null;
    }

    // --- Grid layout ---
    let currentGridCols = parseInt(localStorage.getItem('opsview_grid_cols')) || 3;

    function setGridLayout(cols) {
      currentGridCols = cols;
      localStorage.setItem('opsview_grid_cols', cols);
      const grid = document.getElementById('cctvGrid');
      grid.classList.remove('grid-2', 'grid-3', 'grid-4');
      grid.classList.add('grid-' + cols);
      document.querySelectorAll('#gridLayoutBar .grid-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.cols) === cols);
      });
    }

    // Restore saved grid layout
    (function initGridLayout() {
      setGridLayout(currentGridCols);
    })();

    // --- Grid rendering with SortableJS + preload (no flicker) ---
    let sortableInstance = null;

    /* --- grid watchdog: re-attempt channels whose video stalls (이빨 빠짐 자동복구).
       A live cell's <video> currentTime keeps advancing; if it hasn't moved for a
       full tick (~12s) the channel is dead/never-connected, so re-run the same
       path (relay HLS or local RTSP) for just that cell. ISAPI snapshot cells have
       no <video> and are skipped. --- */
    let gridWatchdog = null;
    let gridCtx = null;
    function stopGridWatchdog() { if (gridWatchdog) { clearInterval(gridWatchdog); gridWatchdog = null; } }
    function startGridWatchdog() {
      stopGridWatchdog();
      if (!gridCtx) return;
      gridWatchdog = setInterval(() => {
        if (!gridCtx || document.hidden) return;
        const grid = document.getElementById('cctvGrid');
        if (!grid || !grid.offsetParent) return; // gone or on another tab (CSS-hidden)
        const ctx = gridCtx;
        const now = Date.now();
        grid.querySelectorAll('.cctv-cell').forEach(cell => {
          const video = cell.querySelector('video');
          if (!video) return; // ISAPI snapshot (<img>) — nothing to reconnect
          const chNum = parseInt(cell.dataset.chnum);
          const tcur = video.currentTime || 0;
          if (tcur > (video._wdLast || 0) + 0.05) { video._wdLast = tcur; video._wdStalls = 0; return; } // advancing — healthy
          video._wdLast = tcur;
          // A reconnect resets currentTime to 0, and the fresh WS stream only starts
          // once the relay sends the next keyframe — a full GOP, which on low-fps CCTV
          // can exceed a tick. Hold off after a reconnect so the new stream can
          // establish instead of being torn down every tick (self-sustaining black loop).
          if (video._wdCooldownUntil && now < video._wdCooldownUntil) return;
          const key = streamKey(ctx.dvr.id, chNum);
          if (channelConnecting && channelConnecting.has(key)) return; // mid-connect, give it time
          // Debounce: require two consecutive stalled ticks so a momentary live-edge
          // pause (MSE waiting for the next fragment) doesn't trigger a needless reconnect.
          video._wdStalls = (video._wdStalls || 0) + 1;
          if (video._wdStalls < 2) return;
          video._wdStalls = 0;
          video._wdCooldownUntil = now + 30000; // grace > GOP before we may re-attempt
          console.log('[cctv] watchdog: ch' + chNum + ' stalled — reconnecting');
          if (ctx.useRelayHLS && ctx.streamDvrId != null) {
            playRelayCCTV(video, ctx.scheme, ctx.ip, ctx.port, ctx.streamDvrId, chNum);
          } else if (ctx.isRTSP) {
            startRTSPChannel(ctx.dvr.id, chNum, video, channelPeerConns);
          }
        });
      }, 12000);
    }

    // === Relay live wall (GPU mosaic) ===
    // One composited stream from the relay replaces N per-channel decodes, so weak
    // viewers (e.g. the N100) show every camera instantly instead of choking on 30+
    // simultaneous H.264 decoders — the relay does decode+compose+encode on its GPU.
    let wallExpandState = null;

    function wallBufEnd(v) {
      try { return v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0; } catch (e) { return 0; }
    }

    // fetchWallLayout caches the relay's mosaic layout (grid shape + ordered cells)
    // so the overlay's click targets line up exactly with the composited tiles.
    // Each wall has a stable uuid (persisted in localStorage), used as its stream id
    // "wallg<uuid>" — the relay stores the wall's order/columns/membership in SQLite
    // keyed by that uuid and composes/broadcasts it. roleKey makes one uuid per
    // (purpose, agent, DVR) so the CCTV-tab wall and the collage grid wall differ.
    function wallUuid(roleKey) {
      const k = 'wall_uuid_' + roleKey;
      let u = localStorage.getItem(k);
      if (!u) {
        u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem(k, u);
      }
      return u;
    }
    function wallIdForDvr(dvr) {
      const aid = (window.survRemoteConfig && window.survRemoteConfig.agent_id) || '';
      return 'wallg' + wallUuid('cctv-' + aid + '-' + relayStreamDvrId(dvr));
    }
    function wallScopeKey(dvr) {
      return ((window.survRemoteConfig && window.survRemoteConfig.agent_id) || '') + '|' + relayStreamDvrId(dvr);
    }
    async function fetchWallLayout(dvr) {
      const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
      const aid = window.survRemoteConfig && window.survRemoteConfig.agent_id;
      const scopeKey = wallScopeKey(dvr);
      const q = '?agent=' + encodeURIComponent(aid || '') + '&wall=' + encodeURIComponent(wallIdForDvr(dvr));
      let layout;
      try {
        const r = await fetch(scheme + '://' + ip + ':' + port + '/surv/walllayout' + q);
        layout = await r.json();
      } catch (e) {
        layout = { enabled: false };
      }
      layout._scope = scopeKey;
      window._wallLayout = layout;
      return layout;
    }

    // teardownWallIn closes the wall player living on a grid's <video> (the player
    // is stored per-video, so the CCTV tab and the 같이보기 grid don't fight over a
    // single global) and dismisses any fullscreen expand.
    function teardownWallIn(grid) {
      const v = grid && grid.querySelector('.wall-video');
      if (v && v._wallPlayer) { try { v._wallPlayer.close(); } catch (e) {} v._wallPlayer = null; }
      if (grid && grid.querySelector('.wall-overlay') && window._wallSortable) {
        try { window._wallSortable.destroy(); } catch (e) {} window._wallSortable = null;
      }
      closeWallExpand();
    }

    // startWallPlayer plays the wall WS stream with forever-reconnect + a stall
    // watchdog (rebuild a frozen feed), so the wall self-heals like the per-cell grid.
    function startWallPlayer(video, wsUrl) {
      if (video._wallPlayer) { try { video._wallPlayer.close(); } catch (e) {} video._wallPlayer = null; }
      let player = null, backoff = 0, reconnTimer = null, lastT = -1, lastAt = Date.now();
      const play = () => {
        if (player) { try { player.close(); } catch (e) {} player = null; }
        player = playRelayCCTVWS(video, wsUrl, () => schedule());
      };
      const schedule = () => {
        backoff = backoff ? Math.min(backoff * 2, 15000) : 1000;
        clearTimeout(reconnTimer); reconnTimer = setTimeout(play, backoff);
      };
      const watchdog = setInterval(() => {
        const t = Math.max(video.currentTime || 0, wallBufEnd(video));
        if (t > lastT + 0.01) { lastT = t; lastAt = Date.now(); backoff = 0; }
        else if (Date.now() - lastAt > 8000) { lastAt = Date.now(); play(); }
      }, 3000);
      video._wallPlayer = {
        close() {
          clearTimeout(reconnTimer); clearInterval(watchdog);
          if (player) { try { player.close(); } catch (e) {} player = null; }
        }
      };
      play();
    }

    function renderRelayWall(dvr, grid, layout, wallId) {
      wallId = wallId || wallIdForDvr(dvr);
      grid.classList.remove('grid-2', 'grid-3', 'grid-4', 'cols-3', 'cols-4');
      grid.classList.add('cctv-wall');
      grid.dataset.wallRows = layout.rows; // for smart-fit (size the right column to match)
      grid.dataset.wallCols = layout.cols;
      const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
      const aid = window.survRemoteConfig && window.survRemoteConfig.agent_id;
      const scope = aid ? encodeURIComponent(aid) + '/' : '';
      const wsUrl = (scheme === 'https' ? 'wss' : 'ws') + '://' + ip + ':' + port + '/surv/ws/' + scope + wallId;

      grid.innerHTML = '<div class="wall-wrap"><video class="wall-video" autoplay muted playsinline></video><div class="wall-overlay"></div></div>';
      const video = grid.querySelector('.wall-video');
      const overlay = grid.querySelector('.wall-overlay');
      overlay.style.gridTemplateColumns = 'repeat(' + layout.cols + ',1fr)';
      overlay.style.gridTemplateRows = 'repeat(' + layout.rows + ',1fr)';
      (layout.cells || []).forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'wall-cell';
        btn.dataset.id = c.id;
        const nm = document.createElement('span');
        nm.className = 'wall-cell-name';
        nm.textContent = c.name || c.id;
        btn.appendChild(nm);
        btn.addEventListener('dblclick', () => expandWallChannel(dvr, c));
        overlay.appendChild(btn);
      });
      startWallPlayer(video, wsUrl);

      // Drag-to-reorder tiles: the wall is ONE relay-composited stream, so the order
      // lives on the relay — POST the new order and it recomposes the mosaic. `delay`
      // separates a click/dblclick (expand) from a drag (reorder).
      if (window._wallSortable) { try { window._wallSortable.destroy(); } catch (e) {} }
      window._wallSortable = new Sortable(overlay, {
        animation: 200, draggable: '.wall-cell', delay: 130, delayOnTouchOnly: false,
        ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen',
        onEnd: function () {
          const order = Array.from(overlay.children).map(el => el.dataset.id).filter(Boolean);
          postWallOrder(dvr, order, wallId);
        }
      });
    }

    // postWallOrder persists a wall's tile order/membership on the relay, which
    // recomposes the mosaic. Cached per wall id so an unchanged list (e.g. a plain
    // re-render of a group wall) doesn't churn a rebuild — only a real change posts.
    function postWallOrder(dvr, order, wallId, cols) {
      wallId = wallId || wallIdForDvr(dvr);
      window._wallGroupCache = window._wallGroupCache || {};
      const sig = (order || []).join(',') + '|' + (cols || 0);
      if (window._wallGroupCache[wallId] === sig) return;
      window._wallGroupCache[wallId] = sig;
      const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
      const aid = window.survRemoteConfig && window.survRemoteConfig.agent_id;
      const url = scheme + '://' + ip + ':' + port + '/surv/wallorder?agent=' +
        encodeURIComponent(aid || '') + '&wall=' + encodeURIComponent(wallId) +
        (cols ? '&cols=' + cols : '');
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order || []) })
        .then(() => { window._wallLayout = null; }) // changed -> re-fetch layout next render
        .catch(() => { window._wallGroupCache[wallId] = null; }); // failed -> allow retry
    }

    // renderCollageGridWall composites the collage's main grid (an arbitrary channel
    // subset) into ONE group wall, so the collage decodes ~1 stream there instead of
    // N. The small overflow cells stay individual. Layout is computed client-side
    // (same ceil(sqrt) the relay uses) so the overlay lines up without a fetch.
    // renderGroupWall composites an explicit channel set into ONE wall (uuid-keyed,
    // membership+columns persisted on the relay) and renders it into grid. Layout is
    // computed client-side (same ceil(sqrt) the relay uses, or the given cols) so the
    // overlay lines up without a layout fetch.
    function renderGroupWall(dvr, grid, channels, wallId, cols) {
      const sid = relayStreamDvrId(dvr);
      const ids = channels.map(ch => 'dvr' + sid + '_ch' + ch.ch_num);
      cols = cols || Math.max(1, Math.ceil(Math.sqrt(ids.length)));
      const rows = Math.ceil(ids.length / cols);
      const layout = { rows, cols, cells: channels.map((ch, i) => ({ i: i, id: ids[i], name: ch.name })) };
      postWallOrder(dvr, ids, wallId, cols); // membership + columns on the relay (keyed by the wall uuid)
      renderRelayWall(dvr, grid, layout, wallId);
    }
    function renderCollageGridWall(dvr, grid, channels) {
      const aid = (window.survRemoteConfig && window.survRemoteConfig.agent_id) || '';
      const wallId = 'wallg' + wallUuid('collage-' + aid + '-' + relayStreamDvrId(dvr));
      renderGroupWall(dvr, grid, channels, wallId, Math.min(3, channels.length)); // 3-wide collage grid
    }

    function expandWallChannel(dvr, cell) {
      const m = /^dvr(\d+)_ch(\d+)$/.exec(cell.id || '');
      if (!m) return;
      openWallExpand(dvr, parseInt(m[1]), parseInt(m[2]), cell.name || cell.id);
    }

    function openWallExpand(dvr, streamDvrId, chNum, name) {
      closeWallExpand();
      const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
      const ov = document.createElement('div');
      ov.className = 'wall-expand';
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true;
      const bar = document.createElement('div');
      bar.className = 'wall-expand-bar';
      const label = document.createElement('span');
      label.textContent = name + ' (CH' + chNum + ')';
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕';
      bar.appendChild(label); bar.appendChild(closeBtn);
      ov.appendChild(v); ov.appendChild(bar);
      document.body.appendChild(ov);
      playRelayCCTV(v, scheme, ip, port, streamDvrId, chNum);
      const onKey = (e) => { if (e.key === 'Escape') closeWallExpand(); };
      document.addEventListener('keydown', onKey);
      closeBtn.onclick = () => closeWallExpand();
      ov.addEventListener('dblclick', (e) => { if (e.target === ov || e.target === v) closeWallExpand(); });
      wallExpandState = { el: ov, onKey, video: v };
    }

    function closeWallExpand() {
      if (!wallExpandState) return;
      const s = wallExpandState; wallExpandState = null;
      document.removeEventListener('keydown', s.onKey);
      teardownCellPlayer(s.video);
      if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
    }

    function renderCCTVGrid(dvr) {
      const grid = document.getElementById('cctvGrid');
      cctvRenderedDvrId = dvr ? dvr.id : null;
      cctvTimers.forEach(t => clearInterval(t));
      cctvTimers = [];
      stopGridWatchdog();
      gridCtx = null;
      collapseCell(true);
      cleanupAllStreams(true);
      teardownWallIn(grid); // tear down any prior live-wall player before re-rendering
      grid.classList.remove('cctv-wall');
      if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }

      const enabled = cctvChannels.filter(ch => ch.enabled);
      enabled.sort((a, b) => a.order - b.order);

      if (enabled.length === 0) {
        grid.innerHTML = '<div class="cctv-no-channels"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><path d="M2 2l20 20"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16"/><path d="M9.5 4h5L17 7h3a2 2 0 0 1 2 2v7.5"/><path d="M14.121 9.879A3 3 0 0 1 15 12"/></svg>' + t('noChannelsFound') + '</div>';
        return;
      }

      grid.innerHTML = '';
      // Ensure grid layout class is applied
      grid.classList.remove('grid-2', 'grid-3', 'grid-4');
      grid.classList.add('grid-' + currentGridCols);
      const isRTSP = dvr && dvr.protocol === 'rtsp';
      const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;

      const useRelayHLS = shouldUseRelayHLS(dvr);
      const streamDvrId = relayStreamDvrId(dvr);

      // Relay live wall: one GPU-composited stream replaces N per-channel decodes
      // (weak clients choke on 30+ concurrent decoders). Falls back to the
      // per-channel grid when the relay has no wall (RELAY_WALL off).
      if (useRelayHLS) {
        const scopeKey = wallScopeKey(dvr); // per-DVR: each tab shows only its cameras
        const wl = window._wallLayout;
        if (wl && wl._scope === scopeKey) {
          if (wl.enabled) { renderGroupWall(dvr, grid, enabled, wallIdForDvr(dvr)); return; }
          // wall disabled on the relay -> fall through to the per-channel grid below
        } else {
          grid.innerHTML = '<div class="cctv-no-channels">Wall…</div>';
          const rid = dvr ? dvr.id : null;
          fetchWallLayout(dvr).then(() => { if (cctvRenderedDvrId === rid) renderCCTVGrid(dvr); });
          return;
        }
      }

      enabled.forEach(ch => {
        const cell = document.createElement('div');
        cell.className = 'cctv-cell';
        cell.dataset.chnum = ch.ch_num;
        cell.style.aspectRatio = '5/3';

        if (useRelayHLS && streamDvrId != null) {
          // HLS via relay proxy (remote tab or LAN DVR via agent)
          const video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
           video.style.width = '100%';
          video.style.height = '100%';
          video.style.objectFit = 'cover';
          video.style.background = 'transparent';
          const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
          playRelayCCTV(video, scheme, ip, port, streamDvrId, ch.ch_num);
          cell.appendChild(video);
        } else if (isRTSP) {
          // RTSP: <video> (WebRTC or HLS depending on codec)
          const video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.id = 'cctv-video-' + ch.ch_num;
          cell.appendChild(video);
          // Connections started via staggered function after grid is built
        } else {
          // ISAPI: <img> + snapshot polling
          const img = document.createElement('img');
          img.alt = ch.name;
          img.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          img.onerror = function() { this.style.opacity = '0.3'; };
          img.onload = function() { this.style.opacity = '1'; };
          cell.appendChild(img);

          const timer = setInterval(() => {
            const preload = new Image();
            preload.onload = () => {
              img.src = preload.src;
              img.style.opacity = '1';
            };
            preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          }, refreshMs);
          cctvTimers.push(timer);
        }

        // Label (common)
        const label = document.createElement('div');
        label.className = 'ch-label';
        if (useRelayHLS) {
          // Relay channels: read-only label
          const nameSpan = document.createElement('span');
          nameSpan.className = 'ch-name';
          nameSpan.textContent = ch.name;
          nameSpan.style.cursor = 'default';
          label.appendChild(nameSpan);
        } else {
          const nameInput = document.createElement('input');
          nameInput.className = 'ch-name';
          nameInput.value = ch.name;
          nameInput.addEventListener('change', () => renameChannel(ch.id, nameInput.value, ch));
          nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });
          label.appendChild(nameInput);
        }

        const info = document.createElement('span');
        info.className = 'ch-id';
        info.textContent = 'CH' + ch.ch_num;
        label.appendChild(info);

        if (ch.width > 0) {
          const res = document.createElement('span');
          res.className = 'ch-res';
          res.textContent = ch.width + 'x' + ch.height;
          label.appendChild(res);
        }

        cell.appendChild(label);
        cell.addEventListener('dblclick', (e) => {
          if (e.target.classList.contains('ch-name')) return;
          expandCell(ch.ch_num, ch.name, grid, cell);
        });
        grid.appendChild(cell);
      });

      // Start RTSP streams with staggered connections (after grid is built)
      console.log('[cctv] renderCCTVGrid: isRTSP=' + isRTSP + ' useRelayHLS=' + useRelayHLS + ' CM=' + !!CM() + ' enabled=' + enabled.length);
      if (isRTSP && !useRelayHLS && CM()) {
        console.log('[cctv] renderCCTVGrid: starting staggered connections for ' + enabled.length + ' channels');
        startRTSPChannelsStaggered(dvr.id, enabled,
          (chNum) => document.getElementById('cctv-video-' + chNum),
          channelPeerConns
        );
      }

      // Arm the watchdog so any cell that fails to start (이빨 빠짐) auto-recovers.
      let _wdEp = { scheme: 'http', ip: '', port: '' };
      if (useRelayHLS) { _wdEp = resolveRelayHLSEndpoint(dvr); }
      gridCtx = { dvr: dvr, isRTSP: isRTSP, useRelayHLS: useRelayHLS, streamDvrId: streamDvrId,
        scheme: _wdEp.scheme, ip: _wdEp.ip, port: _wdEp.port };
      startGridWatchdog();

      // Initialize SortableJS on the grid
      sortableInstance = new Sortable(grid, {
        animation: 300,
        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        forceFallback: true,
        fallbackClass: 'sortable-fallback',
        fallbackOnBody: true,
        delay: 50,
        delayOnTouchOnly: false,
        swapThreshold: 0.5,
        filter: '.ch-name',
        preventOnFilter: false,
        draggable: '.cctv-cell',
        onEnd: function(evt) {
          if (evt.oldIndex === evt.newIndex) return;
          const cells = grid.querySelectorAll('.cctv-cell');
          const newOrder = Array.from(cells).map(c => parseInt(c.dataset.chnum));
          newOrder.forEach((num, i) => {
            const ch = cctvChannels.find(c => c.ch_num === num);
            if (ch) ch.order = i;
          });
          if (CM() && activeDvrId) {

    function clearSmartFit() {

    // Choose the left-grid column count whose tile shape is closest to a natural
    // CCTV aspect; the divider then sits at cols/(cols+rightCols) so the right
    // column is exactly `rightCols` tiles wide and the whole screen is filled.
    function computeSmartFit(W, H, nLeft, rightCols) {
      const target = 1.55;       // desired tile width / height
      const minOpsFrac = 0.16;   // Ops keeps >= this fraction of the right column
      const emptyPenalty = 0.35; // strongly prefer grids that leave no empty cells
      let best = null;
      for (let cols = 1; cols <= nLeft; cols++) {
        const rows = Math.ceil(nLeft / cols);
        if (rightCols > 0 && (1 - 2 / rows) < minOpsFrac) continue; // 2 overflow rows
        const leftW = W * cols / (cols + rightCols);
        const tileAspect = (leftW / cols) / (H / rows);
        const empty = cols * rows - nLeft; // unfilled slots in the last row
        const score = Math.abs(Math.log(tileAspect / target)) + empty * emptyPenalty;
        if (!best || score < best.score) best = { cols, rows, score };
      }
      if (!best) {
        const cols = Math.min(nLeft, 3);
        best = { cols, rows: Math.ceil(nLeft / cols), score: 0 };
      }
      return best;
    }

    function applySmartFit() {
      if (!smartFitEnabled) return;
      const split = document.getElementById('mixedSplit');
      const grid = document.getElementById('mixedCctvGrid');
      const left = document.getElementById('mixedLeft');
      const right = document.getElementById('mixedRight');
      const topRow = document.getElementById('mixedCctvTopRow');
      const bottomRow = document.getElementById('mixedCctvBottomRow');
      if (!split || !grid || !left) return;
      // When the left grid is a relay wall there are no .cctv-cells to size — the
      // wall fills the left via CSS — but smart-fit still drives the divider and
      // matches the right column's row height to a wall row (wall height / rows).
      const isWall = grid.classList.contains('cctv-wall');
      const cells = grid.querySelectorAll('.cctv-cell');
      const nLeft = isWall ? (grid.querySelectorAll('.wall-cell').length || 1) : cells.length;
      if (!nLeft) return;
      const gap = 3, pad = 3;
      const sizeCells = (cellW, cellH) => {
        if (cellW <= 0 || cellH <= 0) return false;
        cells.forEach(c => { c.style.width = cellW + 'px'; c.style.height = cellH + 'px'; c.style.aspectRatio = 'auto'; });
        return true;
      };

      if (mixedLayout === 'collage') {
        const W = split.clientWidth, H = split.clientHeight;
        if (W <= 0 || H <= 0) return;
        const rightCols = ((topRow && topRow.children.length) || (bottomRow && bottomRow.children.length)) ? 2 : 0;
        let cols, rows;
        if (isWall) {
          cols = parseInt(grid.dataset.wallCols) || Math.min(3, nLeft);
          rows = parseInt(grid.dataset.wallRows) || Math.ceil(nLeft / cols);
        } else {
          const fit = computeSmartFit(W, H, nLeft, rightCols);
          cols = fit.cols; rows = fit.rows;
        }
        // Size the left region so the wall fills it WITHOUT stretch: width = wall
        // aspect ((cols*16):(rows*9)) * height. (Per-channel grid keeps the old
        // cols/(cols+rightCols) divider.) Capped so the right column keeps room.
        let leftFrac;
        if (isWall && rightCols > 0) {
          const mosaicAR = (cols * 16) / (rows * 9);
          leftFrac = Math.max(0.35, Math.min(0.82, (mosaicAR * H) / W));
        } else {
          leftFrac = rightCols > 0 ? cols / (cols + rightCols) : 1;
        }
        left.style.flexBasis = (leftFrac * 100) + '%';
        const cellH = (H - 2 * pad - (rows - 1) * gap) / rows; // height of one left row
        if (!isWall) {
          const leftW = W * leftFrac;
          const cellW = (leftW - 2 * pad - (cols - 1) * gap) / cols - 1; // -1: avoid sub-pixel wrap
          if (!sizeCells(cellW, cellH)) return;
        }
        // Right overflow rows match a left-row height; the Ops board fills the rest.
        const rowHpx = cellH + 2 * pad, rowH = rowHpx + 'px';
        let numRows = 0;
        [topRow, bottomRow].forEach(r => {
          if (r && r.children.length) { r.style.flex = '0 0 ' + rowH; r.style.height = rowH; numRows++; }
        });
        const mainArea = right ? right.querySelector('.mixed-main-area') : null;
        if (mainArea) mainArea.style.flex = '0 0 ' + Math.max(60, H - numRows * rowHpx) + 'px';
        if (right) right.classList.remove('ops-custom');
      } else {
        if (isWall) return; // wall fills via CSS; nothing to size
        // Horizontal / vertical: fill the CCTV grid within its current container
        // (no overflow rows, divider left as the user set it).
        const gridW = grid.clientWidth, gridH = grid.clientHeight;
        if (gridW <= 0 || gridH <= 0) return;
        const fit = computeSmartFit(gridW, gridH, nLeft, 0);
        const cellW = (gridW - 2 * pad - (fit.cols - 1) * gap) / fit.cols - 1;
        const cellH = (gridH - 2 * pad - (fit.rows - 1) * gap) / fit.rows;
        sizeCells(cellW, cellH);
      }
    }

      document.addEventListener('mousemove', e => {

    function swapMixedPanes() {
      mixedSwapped = !mixedSwapped;
      localStorage.setItem('opsview_mixed_swapped', mixedSwapped);
      animateMixedReorder(applyMixedOrder);
      document.getElementById('swapBtn').classList.toggle('active', mixedSwapped);
    }

    // FLIP-animate a reorder of the mixed panes so Swap slides them into place
    // instead of snapping: record positions, reorder, then play from the old
    // position back to identity.
    function animateMixedReorder(doReorder) {
      const els = ['mixedLeft', 'mixedDivider', 'mixedRight'].map(id => document.getElementById(id)).filter(Boolean);
      const first = els.map(el => el.getBoundingClientRect());
      doReorder();
      const last = els.map(el => el.getBoundingClientRect());
      els.forEach((el, i) => {
        const dx = first[i].left - last[i].left;
        const dy = first[i].top - last[i].top;
        if (!dx && !dy) return;
        el.style.transition = 'none';
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      });
      requestAnimationFrame(() => {
        els.forEach(el => {
          el.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
          el.style.transform = '';
        });
      });
      clearTimeout(window._mixedReorderTimer);
      window._mixedReorderTimer = setTimeout(() => {
        els.forEach(el => { el.style.transition = ''; el.style.transform = ''; });
      }, 520);
    }

    function applyMixedOrder() {
      const split = document.getElementById('mixedSplit');
      const left = document.getElementById('mixedLeft');
      const divider = document.getElementById('mixedDivider');
      const right = document.getElementById('mixedRight');
      // Default: CCTV first, Canvas second
      // Swapped: Canvas first, CCTV second
      // Vertical default: Canvas first (top), CCTV second (bottom)
      // Vertical swapped: CCTV first (top), Canvas second (bottom)
      const isVert = mixedLayout === 'vertical';
      const cctvFirst = isVert ? mixedSwapped : !mixedSwapped;
      if (cctvFirst) {
        split.insertBefore(left, split.firstChild);
        split.insertBefore(divider, right);
      } else {
        split.insertBefore(right, split.firstChild);
        split.insertBefore(divider, left);
      }
    }

    // Split pane resizer
    (function initSplitPane() {
      const divider = document.getElementById('mixedDivider');
      const left = document.getElementById('mixedLeft');
      const split = document.getElementById('mixedSplit');
      let dragging = false;

      divider.addEventListener('mousedown', e => {
        e.preventDefault();
        dragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = mixedLayout === 'vertical' ? 'row-resize' : 'col-resize';
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const rect = split.getBoundingClientRect();
        // Check if mixedLeft is the first child (before divider)
        const leftIsFirst = left === split.firstElementChild;
        let pct;
        if (mixedLayout === 'vertical') {
          const rawPct = ((e.clientY - rect.top) / rect.height) * 100;
          pct = leftIsFirst ? rawPct : (100 - rawPct);
          const clamped = Math.max(15, Math.min(85, pct));
          left.style.flexBasis = clamped + '%';
          localStorage.setItem('opsview_mixed_split_v', clamped);
        } else {
          const rawPct = ((e.clientX - rect.left) / rect.width) * 100;
          pct = leftIsFirst ? rawPct : (100 - rawPct);
          const clamped = Math.max(15, Math.min(85, pct));
          left.style.flexBasis = clamped + '%';
          localStorage.setItem('opsview_mixed_split', clamped);
        }
      });
      document.addEventListener('mouseup', () => {
        if (dragging) {
          dragging = false;
          divider.classList.remove('dragging');
          document.body.style.cursor = '';
        }
      });

      setMixedLayout(mixedLayout);
      document.getElementById('swapBtn').classList.toggle('active', mixedSwapped);
    })();

    // Mixed CCTV grid (read-only, no DND)
    let dvrTabsSortable = null;
    let mixedCctvTimers = [];
    window._mixedReady = true;
    function getMissingMixedChannels(dvrID, channels) {
      return channels.filter(ch => {
        const video = document.getElementById('mixed-video-' + ch.ch_num);
        if (!video) return false;
        const cell = video.parentElement;
        if (isSnapshotCctvCell(cell)) return true;
        if (borrowCctvStreamForMixed(dvrID, ch.ch_num, video)) return false;
        return !cctvVideoHasLiveStream(ch.ch_num);
      });
    }
    function scheduleMixedMissingRetry(dvrID, channels) {
      clearMixedRetryTimers();
      MIXED_MISSING_RETRY_MS.forEach((delay, idx) => {
        const t = setTimeout(() => {
          if (activeDvrId !== dvrID) return;
          attachMixedFromCctv(dvrID, channels);
          const missing = getMissingMixedChannels(dvrID, channels);
          if (missing.length === 0) {
            playMixedCctvVideos();
            return;
          }
          console.log('[cctv] mixed retry ' + (idx + 1) + ': snapshot/low ' + missing.length + ' channels');
          const dvr = dvrs.find(d => d.id === dvrID);
          const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;
          missing.forEach(ch => {
            const cell = document.querySelector('#panel-mixed .cctv-cell[data-chnum="' + ch.ch_num + '"]');
            if (!cell) return;
            if (isSnapshotCctvCell(cell)) {
              const video = document.createElement('video');
              video.autoplay = true;
              video.muted = true;
              video.playsInline = true;
              video.id = 'mixed-video-' + ch.ch_num;
              cell.querySelector('img')?.remove();
              cell.insertBefore(video, cell.firstChild);
              if (borrowCctvStreamForMixed(dvrID, ch.ch_num, video)) {
                cell.querySelector('.ch-status')?.remove();
              } else {
                video.remove();
                const img = document.createElement('img');
                img.alt = ch.name;
                img.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                cell.insertBefore(img, cell.firstChild);
              }
            } else {
              const cctvCell = document.querySelector('#panel-cctv .cctv-cell[data-chnum="' + ch.ch_num + '"]');
              const isCctvSnapshot = !!(cctvCell && isSnapshotCctvCell(cctvCell));
              const isLastRetry = (idx === MIXED_MISSING_RETRY_MS.length - 1);
              if (isCctvSnapshot || isLastRetry) {
                const video = cell.querySelector('video');
                if (video) video.remove();
                cell.querySelector('.ch-status')?.remove();
                const img = document.createElement('img');
                img.alt = ch.name;
                img.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                img.onerror = function() { this.style.opacity = '0.3'; };
                img.onload = function() { this.style.opacity = '1'; };
                cell.insertBefore(img, cell.firstChild);
                const timer = setInterval(() => {
                  const preload = new Image();
                  preload.onload = () => { img.src = preload.src; img.style.opacity = '1'; };
                  preload.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                }, refreshMs);
                mixedCctvTimers.push(timer);
              }
            }
          });
          requestAnimationFrame(() => playMixedCctvVideos());
        }, delay);
        mixedRetryTimers.push(t);
      });
    }
    function renderMixedCCTV() {
      const grid = document.getElementById('mixedCctvGrid');
      const topRow = document.getElementById('mixedCctvTopRow');
      const bottomRow = document.getElementById('mixedCctvBottomRow');
      mixedRenderedDvrId = activeDvrId || null;
      mixedCctvTimers.forEach(t => clearInterval(t));
      mixedCctvTimers = [];
      clearMixedRetryTimers();
      cleanupMixedPCs();
      teardownWallIn(grid); grid.classList.remove('cctv-wall'); // drop any prior wall

      const enabled = cctvChannels.filter(ch => ch.enabled);
      enabled.sort((a, b) => a.order - b.order);

      topRow.innerHTML = '';
      bottomRow.innerHTML = '';

      if (enabled.length === 0 || !activeDvrId) {
        grid.innerHTML = '<div class="cctv-no-channels"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><path d="M2 2l20 20"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16"/><path d="M9.5 4h5L17 7h3a2 2 0 0 1 2 2v7.5"/><path d="M14.121 9.879A3 3 0 0 1 15 12"/></svg>' + t('noCctvMixed') + '</div>';
        grid.classList.remove('cols-3', 'cols-4');
        return;
      }

      // Collage mode: first 2 → top right, last 2 → bottom right, rest → left grid
      // Other modes: all channels go to left grid
      const isCollage = mixedLayout === 'collage';
      const overflowCount = isCollage ? 2 : 0;
      const topChannels = isCollage ? enabled.slice(0, overflowCount) : [];
      const bottomChannels = isCollage
        ? (enabled.length > overflowCount * 2
            ? enabled.slice(enabled.length - overflowCount)
            : enabled.slice(overflowCount, overflowCount * 2))
        : [];
      const gridChannels = enabled.filter(ch =>
        !topChannels.includes(ch) && !bottomChannels.includes(ch)
      );

      const dvr = dvrs.find(d => d.id === activeDvrId);
      const isRTSP = dvr && dvr.protocol === 'rtsp';
      const useRelayHLS = shouldUseRelayHLS(dvr);
      const streamDvrId = relayStreamDvrId(dvr);
      const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;

      // Live wall in the 같이보기 CCTV grid — non-collage only (the wall is ONE
      // composited stream and can't be split into collage's top/bottom/grid regions).
      // Reuses the same per-DVR wall as the CCTV tab (1 decode vs N).
      if (useRelayHLS && !isCollage) {
        const scopeKey = wallScopeKey(dvr);
        const wl = window._wallLayout;
        if (wl && wl._scope === scopeKey) {
          if (wl.enabled) {
            topRow.innerHTML = ''; bottomRow.innerHTML = '';
            renderGroupWall(dvr, grid, enabled, wallIdForDvr(dvr));
            return; // wall replaces the per-channel grid; no sortable
          }
          // wall disabled on the relay -> fall through to the per-channel grid
        } else {
          topRow.innerHTML = ''; bottomRow.innerHTML = '';
          grid.innerHTML = '<div class="cctv-no-channels">Wall…</div>';
          const rid = activeDvrId;
          fetchWallLayout(dvr).then(() => { if (mixedRenderedDvrId === rid) renderMixedCCTV(); });
          return;
        }
      }

      function createCell(ch, container) {
        const cell = document.createElement('div');
        cell.className = 'cctv-cell';
        cell.dataset.chnum = ch.ch_num;
        if (container === grid) cell.style.aspectRatio = '5/3';

        if (useRelayHLS && streamDvrId != null) {
          const video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.objectFit = 'cover';
          video.style.background = 'transparent';
          const { ip, port, scheme } = resolveRelayHLSEndpoint(dvr);
          playRelayCCTV(video, scheme, ip, port, streamDvrId, ch.ch_num);
          cell.appendChild(video);
        } else if (isRTSP) {
          const cctvCell = document.querySelector('#panel-cctv .cctv-cell[data-chnum="' + ch.ch_num + '"]');
          const isCctvSnapshot = !!(cctvCell && isSnapshotCctvCell(cctvCell));
          if (isCctvSnapshot) {
            const img = document.createElement('img');
            img.alt = ch.name;
            img.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
            img.onerror = function() { this.style.opacity = '0.3'; };
            img.onload = function() { this.style.opacity = '1'; };
            cell.appendChild(img);

            const timer = setInterval(() => {
              const preload = new Image();
              preload.onload = () => { img.src = preload.src; img.style.opacity = '1'; };
              preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
            }, refreshMs);
            mixedCctvTimers.push(timer);
          } else {
            const video = document.createElement('video');
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            video.id = 'mixed-video-' + ch.ch_num;
            cell.appendChild(video);
            if (activeDvrId) {
              borrowCctvStreamForMixed(activeDvrId, ch.ch_num, video);
            }
          }
        } else {
          const img = document.createElement('img');
          img.alt = ch.name;
          img.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          img.onerror = function() { this.style.opacity = '0.3'; };
          img.onload = function() { this.style.opacity = '1'; };
          cell.appendChild(img);

          const timer = setInterval(() => {
            const preload = new Image();
            preload.onload = () => {
              img.src = preload.src;
              img.style.opacity = '1';
            };
            preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          }, refreshMs);
          mixedCctvTimers.push(timer);
        }

        const label = document.createElement('div');
        label.className = 'ch-label';
        label.innerHTML = '<span style="font-size:11px;color:#d1d5db;">' + escapeHtml(ch.name) + '</span><span class="ch-id">CH' + ch.ch_num + '</span>';
        cell.appendChild(label);
        cell.addEventListener('dblclick', () => {
          expandCell(ch.ch_num, ch.name, container, cell);
        });
        container.appendChild(cell);
      }

      // Render overflow rows (right side top/bottom)
      topChannels.forEach(ch => createCell(ch, topRow));
      bottomChannels.forEach(ch => createCell(ch, bottomRow));

      // Render left grid (remaining channels). Relay collage: the big grid becomes
      // ONE group wall (1 decode) while the small overflow cells stay individual.
      grid.innerHTML = '';
      grid.classList.remove('cols-3', 'cols-4');
      if (gridChannels.length > 0) {
        if (useRelayHLS && isCollage) {
          renderCollageGridWall(dvr, grid, gridChannels);
        } else {

      if (window._mixedSortables) window._mixedSortables.forEach(s => s.destroy());

        group: 'mixed-cctv',
        animation: 300,

        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        forceFallback: true,
        fallbackClass: 'sortable-fallback',
        fallbackOnBody: true,
        delay: 50,
        swapThreshold: 0.5,
        draggable: '.cctv-cell',
        onEnd: function() {
          // Collect new order from all containers: top → grid → bottom
          const allCells = [
            ...topRow.querySelectorAll('.cctv-cell'),
            ...grid.querySelectorAll('.cctv-cell'),

          }

        if (el.classList.contains('cctv-wall')) return; // grid is a group wall -> its own drag
        if (el.children.length > 0 || el === grid) {
          window._mixedSortables.push(new Sortable(el, mixedSortOpts));

      // Vertical sortable on mixed-right: reorder top row / Ops / bottom row
      const mixedRight = document.getElementById('mixedRight');
      if (window._mixedRightSortable) window._mixedRightSortable.destroy();

        attachMixedFromCctv(dvr.id, enabled);
        requestAnimationFrame(() => playMixedCctvVideos());
      } else if (useRelayHLS) {
        requestAnimationFrame(() => playMixedCctvVideos());
      }

      // Re-fit uniform tiles after the grid is (re)populated.
      if (smartFitEnabled) requestAnimationFrame(applySmartFit);
    }

    // Mixed Ops canvas (mirrors the main canvas region)
    let mixedCanvas, mixedCtx;
    let cropRegion = null; // {x, y, w, h} in source pixels
    let regionSelectActive = false;

    (function initMixedOps() {
      mixedCanvas = document.getElementById('mixedScreen');
      mixedCtx = mixedCanvas.getContext('2d');

      // Mirror Ops source (canvas or video) to mixed canvas every frame
      function mirrorLoop() {
        // Pick source: stream video if active, otherwise relay canvas
        let src = null;
        const video = document.getElementById('streamVideo');
        const canvas = document.getElementById('screen');

        if (streamMode && video && video.readyState >= 2 && video.videoWidth > 0) {
          src = video;
          var srcW = video.videoWidth, srcH = video.videoHeight;
        } else if (canvas && canvas.width > 0 && canvas.height > 0) {
          src = canvas;
          var srcW = canvas.width, srcH = canvas.height;
        }

        if (src) {
          if (cropRegion && mixedLayout === 'collage') {
            // Collage only: keep the selected region's height (vertical zoom) but
            // widen the crop to the Ops pane's aspect so the left/right gaps are
            // filled with the surrounding screen content, region centered. No
            // letterbox, no stretching — just more of the real screen on each side.
            const paneW = mixedCanvas.clientWidth, paneH = mixedCanvas.clientHeight;
            const paneAspect = (paneW > 0 && paneH > 0) ? (paneW / paneH) : (cropRegion.w / cropRegion.h);
            let ch = Math.min(cropRegion.h, srcH);
            let cw = Math.min(ch * paneAspect, srcW);
            const ccx = cropRegion.x + cropRegion.w / 2;
            const ccy = cropRegion.y + cropRegion.h / 2;
            let cx = Math.max(0, Math.min(ccx - cw / 2, srcW - cw));
            let cy = Math.max(0, Math.min(ccy - ch / 2, srcH - ch));
            const cwR = Math.max(1, Math.round(cw)), chR = Math.max(1, Math.round(ch));
            if (mixedCanvas.width !== cwR) mixedCanvas.width = cwR;
            if (mixedCanvas.height !== chR) mixedCanvas.height = chR;
            mixedCtx.drawImage(src, cx, cy, cw, ch, 0, 0, cwR, chR);
          } else if (cropRegion) {
            // Horizontal / vertical: show the region at its own aspect ratio
            // (object-fit: contain handles the letterbox) — no fill, no crop.
            if (mixedCanvas.width !== cropRegion.w) mixedCanvas.width = cropRegion.w;
            if (mixedCanvas.height !== cropRegion.h) mixedCanvas.height = cropRegion.h;
            mixedCtx.drawImage(src, cropRegion.x, cropRegion.y, cropRegion.w, cropRegion.h, 0, 0, cropRegion.w, cropRegion.h);
          } else {
            if (mixedCanvas.width !== srcW || mixedCanvas.height !== srcH) {
              mixedCanvas.width = srcW;
              mixedCanvas.height = srcH;
            }
            mixedCtx.drawImage(src, 0, 0);
          }
        }
        requestAnimationFrame(mirrorLoop);
      }
      mirrorLoop();
    })();

    function setMixedSortablesDisabled(disabled) {

      if (regionSelectActive) {

    function resetRegion() {
      cropRegion = null;
      document.getElementById('regionResetBtn').style.display = 'none';
      localStorage.removeItem('opsview_crop_region');
    }

    (function initRegionSelect() {
      const overlay = document.getElementById('regionOverlay');
      const rect = document.getElementById('regionRect');
      let startX, startY, isDragging = false;

      overlay.addEventListener('mousedown', e => {
        // Region drag must not also start the SortableJS reorder drag on the
        // enclosing .mixed-sortable-item / mixed-right.
        e.preventDefault();
        e.stopPropagation();
        const bounds = overlay.getBoundingClientRect();
        startX = e.clientX - bounds.left;
        startY = e.clientY - bounds.top;
        isDragging = true;
        rect.style.left = startX + 'px';
        rect.style.top = startY + 'px';
        rect.style.width = '0';
        rect.style.height = '0';
        rect.style.display = 'block';
      });

      overlay.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const bounds = overlay.getBoundingClientRect();
        const curX = e.clientX - bounds.left;
        const curY = e.clientY - bounds.top;
        const x = Math.min(startX, curX);
        const y = Math.min(startY, curY);
        const w = Math.abs(curX - startX);
        const h = Math.abs(curY - startY);
        rect.style.left = x + 'px';
        rect.style.top = y + 'px';
        rect.style.width = w + 'px';
        rect.style.height = h + 'px';
      });

      overlay.addEventListener('mouseup', e => {
        if (!isDragging) return;
        isDragging = false;

        const bounds = overlay.getBoundingClientRect();
        const curX = e.clientX - bounds.left;
        const curY = e.clientY - bounds.top;

        const selX = Math.min(startX, curX);
        const selY = Math.min(startY, curY);
        const selW = Math.abs(curX - startX);
        const selH = Math.abs(curY - startY);

        if (selW > 10 && selH > 10) {
          // Get source dimensions (video or canvas)
          const video = document.getElementById('streamVideo');
          const canvas = document.getElementById('screen');
          let srcW, srcH;
          if (streamMode && video && video.videoWidth > 0) {
            srcW = video.videoWidth;
            srcH = video.videoHeight;
          } else if (canvas && canvas.width > 0) {
            srcW = canvas.width;
            srcH = canvas.height;
          } else {
            srcW = bounds.width;
            srcH = bounds.height;
          }

          // Account for object-fit:contain letterboxing
          const containerW = bounds.width;
          const containerH = bounds.height;
          const srcRatio = srcW / srcH;
          const containerRatio = containerW / containerH;
          let renderW, renderH, offsetX, offsetY;
          if (srcRatio > containerRatio) {
            // Source wider → pillarboxed top/bottom
            renderW = containerW;
            renderH = containerW / srcRatio;
            offsetX = 0;
            offsetY = (containerH - renderH) / 2;
          } else {
            // Source taller → letterboxed left/right
            renderH = containerH;
            renderW = containerH * srcRatio;
            offsetX = (containerW - renderW) / 2;
            offsetY = 0;
          }

          // Map selection coords to source coords
          const scale = srcW / renderW;
          cropRegion = {
            x: Math.max(0, Math.round((selX - offsetX) * scale)),
            y: Math.max(0, Math.round((selY - offsetY) * scale)),
            w: Math.min(srcW, Math.round(selW * scale)),
            h: Math.min(srcH, Math.round(selH * scale))
          };
          // Clamp to source bounds
          cropRegion.x = Math.min(cropRegion.x, srcW - cropRegion.w);
          cropRegion.y = Math.min(cropRegion.y, srcH - cropRegion.h);
          if (cropRegion.x < 0) cropRegion.x = 0;
          if (cropRegion.y < 0) cropRegion.y = 0;

          localStorage.setItem('opsview_crop_region', JSON.stringify(cropRegion));
          document.getElementById('regionResetBtn').style.display = 'inline-block';
        }

        rect.style.display = 'none';
        toggleRegionSelect(); // Exit select mode
      });

      // Restore saved crop region
      const saved = localStorage.getItem('opsview_crop_region');
      if (saved) {
        try {
          cropRegion = JSON.parse(saved);
          document.getElementById('regionResetBtn').style.display = 'inline-block';
        } catch(e) {}
      }
    })();

    let currentLang = localStorage.getItem('opsview_lang') || navigator.language.slice(0,2) || 'en';
    if (!i18n[currentLang]) currentLang = 'en';

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || i18n['en'][key] || key;
    }

    // escapeHtml makes attacker-influenced strings (camera channel names, DVR
    // names from devices) safe for innerHTML. Hoisted, so callers above can use it.
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function applyI18n() {
      // Auto-apply data-i18n attributes
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
      });
      // Dynamic elements
      if (!pendingUpdate) {
        document.getElementById('settingsUpdateMsg').textContent = t('upToDate');
      }
    }

    function changeLang(lang) {
      currentLang = lang;
      localStorage.setItem('opsview_lang', lang);
      applyI18n();
      if (typeof loadDVRs === 'function') loadDVRs();
    }

    // ── Settings overlay ──
    function openSettings() {
      const overlay = document.getElementById('settingsOverlay');
      document.getElementById('langSelect').value = currentLang;
      // Load auto-start state
      try {
        window.go.main.App.GetAutoStart().then(v => {
          document.getElementById('autoStartToggle').checked = !!v;
        }).catch(() => {});
      } catch(e) {}
      if (pendingUpdate) {
        document.getElementById('settingsUpdateStatus').style.display = 'none';
        document.getElementById('settingsUpdateAvailable').style.display = 'block';
      }
      const verEl = document.getElementById('settingsVersion');
      if (pendingUpdate) verEl.textContent = vlabel(pendingUpdate.current_ver);
      overlay.style.display = 'flex';
      applyI18n();
      lucide.createIcons();
    }

    function toggleAutoStart(checked) {
      try {
        window.go.main.App.SetAutoStart(checked).catch(err => {
          console.error('SetAutoStart failed:', err);
          document.getElementById('autoStartToggle').checked = !checked;
        });
      } catch(e) {
        document.getElementById('autoStartToggle').checked = !checked;
      }
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').style.display = 'none';
    }

    document.getElementById('settingsOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'settingsOverlay') closeSettings();
    });

    // ── Update ──
    let pendingUpdate = null;

    // Version strings already carry their own "v" prefix (the git tag, e.g.
    // "v0.8.0"). Normalize to exactly one leading "v" so we never render "vv0.8.0".
    function vlabel(s) { return 'v' + String(s == null ? '' : s).replace(/^v+/i, ''); }

    async function checkUpdate() {
      if (!UPD()) return;
      try {
        const info = await UPD().CheckForUpdate();
        if (info && info.available) {
          pendingUpdate = info;
          const msg = t('newVersion').replace('{ver}', vlabel(info.latest_ver)).replace('{cur}', vlabel(info.current_ver));
          document.getElementById('settingsNewVer').textContent = msg;
          document.getElementById('settingsUpdateStatus').style.display = 'none';
          document.getElementById('settingsUpdateAvailable').style.display = 'block';
          document.getElementById('settingsVersion').textContent = vlabel(info.current_ver);
          
          // Show the premium left-bottom auto-update toast
          showUpdateToast(info);
        } else if (info) {
          document.getElementById('settingsVersion').textContent = vlabel(info.current_ver);
        }
      } catch(e) { console.log('update check:', e); }
    }

    function showUpdateToast(info) {
      const toast = document.getElementById('updateToast');
      if (!toast) return;
      
      const verInfo = document.getElementById('toastVerInfo');
      const msgInfo = document.getElementById('toastMsg');
      
      let updateMsg = "최신 버전을 사용할 수 있습니다. 지금 업데이트를 진행하시겠습니까?";
      if (currentLang === 'en') updateMsg = "A new version is available. Would you like to update now?";
      else if (currentLang === 'ja') updateMsg = "最新バージョンが利用可能です。今すぐアップデートしますか？";
      else if (currentLang === 'pt') updateMsg = "Uma nova versão está disponível. Deseja atualizar agora?";
      else if (currentLang === 'es') updateMsg = "Una nueva versión está disponible. ¿Desea actualizar ahora?";
      
      if (msgInfo) msgInfo.textContent = updateMsg;
      if (verInfo) verInfo.textContent = vlabel(info.current_ver) + ' ➔ ' + vlabel(info.latest_ver);
      
      // Reset Toast States
      document.getElementById('toastActionArea').style.display = 'flex';
      document.getElementById('toastProgressArea').style.display = 'none';
      document.getElementById('toastProgressBar').style.width = '0%';
      document.getElementById('toastProgressPercent').textContent = '0%';
      
      // Slide-in Animation
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      toast.style.pointerEvents = 'auto';
      
      lucide.createIcons();
    }

    function dismissUpdateToast() {
      const toast = document.getElementById('updateToast');
      if (!toast) return;
      toast.style.transform = 'translateY(120%)';
      toast.style.opacity = '0';
      toast.style.pointerEvents = 'none';
    }

    async function startToastUpdate() {
      if (!pendingUpdate || !UPD()) return;
      
      document.getElementById('toastActionArea').style.display = 'none';
      document.getElementById('toastProgressArea').style.display = 'block';
      
      const statusText = document.getElementById('toastProgressStatus');
      statusText.textContent = currentLang === 'ko' ? '다운로드 중...' : 'Downloading...';
      statusText.style.color = '';
      
      try {
        const msg = await UPD().DownloadAndInstall(pendingUpdate.download_url);
        // Will close app on Windows/Mac, but if returns
        statusText.textContent = msg || (currentLang === 'ko' ? '완료!' : 'Done!');
      } catch(e) {
        statusText.textContent = (currentLang === 'ko' ? '오류: ' : 'Error: ') + e;
        statusText.style.color = '#ef4444';
        document.getElementById('toastActionArea').style.display = 'flex';
      }
    }

    async function doUpdate() {
      if (!pendingUpdate || !UPD()) return;
      closeSettings();
      showUpdateToast(pendingUpdate);
      startToastUpdate();
    }

    // Bind real-time progress update event from Wails
    if (window.runtime) {
      window.runtime.EventsOn("update-download-progress", (percent) => {
        const rounded = Math.round(percent);
        const bar = document.getElementById('toastProgressBar');
        const percentText = document.getElementById('toastProgressPercent');
        const statusText = document.getElementById('toastProgressStatus');
        
        if (bar) bar.style.width = rounded + '%';
        if (percentText) percentText.textContent = rounded + '%';
        
        if (rounded >= 100 && statusText) {
          statusText.textContent = currentLang === 'ko' ? '설치 및 종료 중...' : 'Installing and relaunching...';
        }
      });
    }

    // Check for updates 3s after launch
    setTimeout(checkUpdate, 3000);
    // Periodically auto-detect update every 30 minutes
    setInterval(checkUpdate, 30 * 60 * 1000);

    // Apply i18n on load
    applyI18n();

    // Init CCTV
    loadDVRs();

    // Surveillance config from agent (via relay WebSocket)
    document.addEventListener('surv-config-updated', async (e) => {
      const cfg = e.detail;
      if (!cfg) return;
      console.log('[surv] remote config:', cfg.dvrs?.length, 'DVRs,', cfg.channels?.length, 'channels');
      window.survRemoteConfig = cfg;
      window._wallLayout = null; // channel set may have changed -> re-fetch wall layout on next render

      const remoteDvrs = [];
      let localAdded = false;

      applyAgentIdsToLocalDvrs(cfg);

      for (const d of (cfg.dvrs || [])) {
        const existsLocally = dvrs.some(ld => !ld._remote && ld.addr === d.addr && ld.port === d.port);
        if (existsLocally) {
          console.log('[surv] DVR', d.name, 'mapped to local entry (agent_id)');
          continue;
        }

        // Try to register locally if Go backend is available
        if (CM()) {
          try {
            const localDvr = await CM().AddDVR(d.name, d.addr, d.port, d.ext_addr || '', d.ext_port || 0, d.username, d.password, d.protocol || 'rtsp');
            let discoverySuccess = false;
            try {
              await CM().UpdateDVR(localDvr.id, d.name, d.addr, d.port, d.ext_addr || '', d.ext_port || 0, d.username, d.password,
                d.refresh_rate || 2000, d.stream_quality || 'sub', d.protocol || 'rtsp');
              // Test if DVR is reachable by discovering channels
              const chs = await CM().DiscoverChannels(localDvr.id);
              if (chs && chs.length > 0) {
                console.log('[surv] DVR', d.name, 'reachable locally:', chs.length, 'channels');
                localAdded = true;
                discoverySuccess = true;
              }
            } catch(discoveryErr) {
              console.log('[surv] DVR discovery failed with error:', discoveryErr);
            }

            if (discoverySuccess) {
              continue; // registered as local DVR successfully
            }

            // Not reachable/discovery failed: remove the local entry
            await CM().DeleteDVR(localDvr.id);
            console.log('[surv] DVR', d.name, 'not reachable locally, using relay');
          } catch(err) {
            console.log('[surv] DVR', d.name, 'local registration failed, using relay:', err);
          }
        }

        // Fallback: treat as remote (HLS via relay)
        remoteDvrs.push({ ...d, _remote: true });
      }

      // Reload local DVRs if any were added
      if (localAdded && CM()) {
        try { dvrs = await CM().ListDVRs() || []; } catch(e) {}
      }

      // Merge: remove old remote DVRs, add new remote ones
      dvrs = dvrs.filter(d => !d._remote).concat(remoteDvrs);
      applyAgentIdsToLocalDvrs(cfg);
      renderDVRTabs();

      // Re-evaluate playback for active local DVR (LAN vs relay)
      const active = dvrs.find(d => d.id === activeDvrId);
      if (active && !active._remote) {
        await refreshDvrReachability(active);
        renderDVRTabs();
        selectDVR(activeDvrId);
      } else if (!activeDvrId || !dvrs.find(d => d.id === activeDvrId)) {
        if (dvrs.length > 0) selectDVR(dvrs[0].id);
      }
    });
  </script>
