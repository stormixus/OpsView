            };
            preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          }, refreshMs);
          cctvTimers.push(timer);
        }

        // Label (common)
        const label = document.createElement('div');
        label.className = 'ch-label';
        if (useRelayHLS) {
          // Relay channels: read-only label
          const nameSpan = document.createElement('span');
          nameSpan.className = 'ch-name';
          nameSpan.textContent = ch.name;
          nameSpan.style.cursor = 'default';
          label.appendChild(nameSpan);
        } else {
          const nameInput = document.createElement('input');
          nameInput.className = 'ch-name';
          nameInput.value = ch.name;
          nameInput.addEventListener('change', () => renameChannel(ch.id, nameInput.value, ch));
          nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });
          label.appendChild(nameInput);
        }

        const info = document.createElement('span');
        info.className = 'ch-id';
        info.textContent = 'CH' + ch.ch_num;
        label.appendChild(info);

        if (ch.width > 0) {
          const res = document.createElement('span');
          res.className = 'ch-res';
          res.textContent = ch.width + 'x' + ch.height;
          label.appendChild(res);
        }

        cell.appendChild(label);
        cell.addEventListener('dblclick', (e) => {
          if (e.target.classList.contains('ch-name')) return;
          expandCell(ch.ch_num, ch.name, grid, cell);
        });
        grid.appendChild(cell);
      });

      // Start RTSP streams with staggered connections (after grid is built)
      console.log('[cctv] renderCCTVGrid: isRTSP=' + isRTSP + ' useRelayHLS=' + useRelayHLS + ' CM=' + !!CM() + ' enabled=' + enabled.length);
      if (isRTSP && !useRelayHLS && CM()) {
        console.log('[cctv] renderCCTVGrid: starting staggered connections for ' + enabled.length + ' channels');
        startRTSPChannelsStaggered(dvr.id, enabled,
          (chNum) => document.getElementById('cctv-video-' + chNum),
          channelPeerConns
        );
      }

      // Initialize SortableJS on the grid
      sortableInstance = new Sortable(grid, {
        animation: 300,
        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        forceFallback: true,
        fallbackClass: 'sortable-fallback',
        fallbackOnBody: true,
        delay: 50,
        delayOnTouchOnly: false,
        swapThreshold: 0.5,
        filter: '.ch-name',
        preventOnFilter: false,
        draggable: '.cctv-cell',
        onEnd: function(evt) {
          if (evt.oldIndex === evt.newIndex) return;
          const cells = grid.querySelectorAll('.cctv-cell');
          const newOrder = Array.from(cells).map(c => parseInt(c.dataset.chnum));
          newOrder.forEach((num, i) => {
            const ch = cctvChannels.find(c => c.ch_num === num);
            if (ch) ch.order = i;
          });
          if (CM() && activeDvrId) {
            CM().ReorderChannels(activeDvrId, newOrder).catch(e => console.error('reorder:', e));
          }
        }
      });
    }

    async function renameChannel(id, newName, ch) {
      if (!CM()) return;
      ch.name = newName;
      try { await CM().UpdateChannel(id, newName, ch.order, ch.enabled); }
      catch(e) { console.error('rename:', e); }
    }

    // === Mixed Panel ===

    let mixedLayout = localStorage.getItem('opsview_mixed_layout') || 'horizontal';

    function setMixedLayout(layout) {
      mixedLayout = layout;
      localStorage.setItem('opsview_mixed_layout', layout);
      const split = document.getElementById('mixedSplit');
      const left = document.getElementById('mixedLeft');
      const btns = document.querySelectorAll('.layout-toggle-btn[data-layout]');
      btns.forEach(b => b.classList.toggle('active', b.dataset.layout === layout));

      if (layout === 'vertical') {
        split.classList.add('vertical');
        split.classList.remove('collage');
        const saved = localStorage.getItem('opsview_mixed_split_v');
        left.style.flexBasis = saved ? saved + '%' : '40%';
      } else if (layout === 'collage') {
        split.classList.remove('vertical');
        split.classList.add('collage');
        const saved = localStorage.getItem('opsview_mixed_split');
        left.style.flexBasis = saved ? saved + '%' : '40%';
      } else {
        split.classList.remove('vertical', 'collage');
        const saved = localStorage.getItem('opsview_mixed_split');
        left.style.flexBasis = saved ? saved + '%' : '40%';
      }
      applyMixedOrder();
      if (window._mixedReady) renderMixedCCTV();
    }

    let mixedSwapped = localStorage.getItem('opsview_mixed_swapped') === 'true';

    function swapMixedPanes() {
      mixedSwapped = !mixedSwapped;
      localStorage.setItem('opsview_mixed_swapped', mixedSwapped);
      applyMixedOrder();
      document.getElementById('swapBtn').classList.toggle('active', mixedSwapped);
    }

    function applyMixedOrder() {
      const split = document.getElementById('mixedSplit');
      const left = document.getElementById('mixedLeft');
      const divider = document.getElementById('mixedDivider');
      const right = document.getElementById('mixedRight');
      // Default: CCTV first, Canvas second
      // Swapped: Canvas first, CCTV second
      // Vertical default: Canvas first (top), CCTV second (bottom)
      // Vertical swapped: CCTV first (top), Canvas second (bottom)
      const isVert = mixedLayout === 'vertical';
      const cctvFirst = isVert ? mixedSwapped : !mixedSwapped;
      if (cctvFirst) {
        split.insertBefore(left, split.firstChild);
        split.insertBefore(divider, right);
      } else {
        split.insertBefore(right, split.firstChild);
        split.insertBefore(divider, left);
      }
    }

    // Split pane resizer
    (function initSplitPane() {
      const divider = document.getElementById('mixedDivider');
      const left = document.getElementById('mixedLeft');
      const split = document.getElementById('mixedSplit');
      let dragging = false;

      divider.addEventListener('mousedown', e => {
        e.preventDefault();
        dragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = mixedLayout === 'vertical' ? 'row-resize' : 'col-resize';
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const rect = split.getBoundingClientRect();
        // Check if mixedLeft is the first child (before divider)
        const leftIsFirst = left === split.firstElementChild;
        let pct;
        if (mixedLayout === 'vertical') {
          const rawPct = ((e.clientY - rect.top) / rect.height) * 100;
          pct = leftIsFirst ? rawPct : (100 - rawPct);
          const clamped = Math.max(15, Math.min(85, pct));
          left.style.flexBasis = clamped + '%';
          localStorage.setItem('opsview_mixed_split_v', clamped);
        } else {
          const rawPct = ((e.clientX - rect.left) / rect.width) * 100;
          pct = leftIsFirst ? rawPct : (100 - rawPct);
          const clamped = Math.max(15, Math.min(85, pct));
          left.style.flexBasis = clamped + '%';
          localStorage.setItem('opsview_mixed_split', clamped);
        }
      });
      document.addEventListener('mouseup', () => {
        if (dragging) {
          dragging = false;
          divider.classList.remove('dragging');
          document.body.style.cursor = '';
        }
      });
      // Restore saved layout, split, and swap state
      setMixedLayout(mixedLayout);
      document.getElementById('swapBtn').classList.toggle('active', mixedSwapped);
    })();

    // Mixed CCTV grid (read-only, no DND)
    let dvrTabsSortable = null;
    let mixedCctvTimers = [];
    window._mixedReady = true;
    function getMissingMixedChannels(dvrID, channels) {
      return channels.filter(ch => {
        const video = document.getElementById('mixed-video-' + ch.ch_num);
        if (!video) return false;
        const cell = video.parentElement;
        if (isSnapshotCctvCell(cell)) return true;
        if (borrowCctvStreamForMixed(dvrID, ch.ch_num, video)) return false;
        return !cctvVideoHasLiveStream(ch.ch_num);
      });
    }
    function scheduleMixedMissingRetry(dvrID, channels) {
      clearMixedRetryTimers();
      MIXED_MISSING_RETRY_MS.forEach((delay, idx) => {
        const t = setTimeout(() => {
          if (activeDvrId !== dvrID) return;
          attachMixedFromCctv(dvrID, channels);
          const missing = getMissingMixedChannels(dvrID, channels);
          if (missing.length === 0) {
            playMixedCctvVideos();
            return;
          }
          console.log('[cctv] mixed retry ' + (idx + 1) + ': snapshot/low ' + missing.length + ' channels');
          const dvr = dvrs.find(d => d.id === dvrID);
          const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;
          missing.forEach(ch => {
            const cell = document.querySelector('#panel-mixed .cctv-cell[data-chnum="' + ch.ch_num + '"]');
            if (!cell) return;
            if (isSnapshotCctvCell(cell)) {
              const video = document.createElement('video');
              video.autoplay = true;
              video.muted = true;
              video.playsInline = true;
              video.id = 'mixed-video-' + ch.ch_num;
              cell.querySelector('img')?.remove();
              cell.insertBefore(video, cell.firstChild);
              if (borrowCctvStreamForMixed(dvrID, ch.ch_num, video)) {
                cell.querySelector('.ch-status')?.remove();
              } else {
                video.remove();
                const img = document.createElement('img');
                img.alt = ch.name;
                img.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                cell.insertBefore(img, cell.firstChild);
              }
            } else {
              const cctvCell = document.querySelector('#panel-cctv .cctv-cell[data-chnum="' + ch.ch_num + '"]');
              const isCctvSnapshot = !!(cctvCell && isSnapshotCctvCell(cctvCell));
              const isLastRetry = (idx === MIXED_MISSING_RETRY_MS.length - 1);
              if (isCctvSnapshot || isLastRetry) {
                const video = cell.querySelector('video');
                if (video) video.remove();
                cell.querySelector('.ch-status')?.remove();
                const img = document.createElement('img');
                img.alt = ch.name;
                img.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                img.onerror = function() { this.style.opacity = '0.3'; };
                img.onload = function() { this.style.opacity = '1'; };
                cell.insertBefore(img, cell.firstChild);
                const timer = setInterval(() => {
                  const preload = new Image();
                  preload.onload = () => { img.src = preload.src; img.style.opacity = '1'; };
                  preload.src = '/cctv/snapshot/' + dvrID + '/' + ch.ch_num + '?t=' + Date.now();
                }, refreshMs);
                mixedCctvTimers.push(timer);
              }
            }
          });
          requestAnimationFrame(() => playMixedCctvVideos());
        }, delay);
        mixedRetryTimers.push(t);
      });
    }
    function renderMixedCCTV() {

      const topChannels = isCollage ? enabled.slice(0, overflowCount) : [];
      const bottomChannels = isCollage
        ? (enabled.length > overflowCount * 2
            ? enabled.slice(enabled.length - overflowCount)
            : enabled.slice(overflowCount, overflowCount * 2))

      const gridChannels = enabled.filter(ch =>
        !topChannels.includes(ch) && !bottomChannels.includes(ch)
      );

      const dvr = dvrs.find(d => d.id === activeDvrId);
      const isRTSP = dvr && dvr.protocol === 'rtsp';
      const useRelayHLS = shouldUseRelayHLS(dvr);
      const streamDvrId = relayStreamDvrId(dvr);
      const refreshMs = (dvr && dvr.refresh_rate) ? dvr.refresh_rate : 2000;

      function createCell(ch, container) {
        const cell = document.createElement('div');
        cell.className = 'cctv-cell';
        cell.dataset.chnum = ch.ch_num;

          const { ip, port } = resolveRelayHLSEndpoint(dvr);
          const hlsUrl = 'http://' + ip + ':' + port + '/surv/dvr' + streamDvrId + '_ch' + ch.ch_num + '/index.m3u8';
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true, lowLatencyMode: true, manifestLoadingMaxRetry: 2, manifestLoadingRetryDelay: 3000 });
            hls.loadSource(hlsUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.ERROR, (evt, data) => {
              if (data.fatal) {
                console.warn('[surv] mixed HLS fatal ch' + ch.ch_num + ':', data.type, data.details);
                hls.destroy();
              }
            });
            remoteHlsInstances.push(hls);
          } else {
            video.src = hlsUrl;
          }
          cell.appendChild(video);
        } else if (isRTSP) {
          const cctvCell = document.querySelector('#panel-cctv .cctv-cell[data-chnum="' + ch.ch_num + '"]');
          const isCctvSnapshot = !!(cctvCell && isSnapshotCctvCell(cctvCell));
          if (isCctvSnapshot) {
            const img = document.createElement('img');

            img.onerror = function() { this.style.opacity = '0.3'; };
            img.onload = function() { this.style.opacity = '1'; };
            cell.appendChild(img);

            const timer = setInterval(() => {
              const preload = new Image();
              preload.onload = () => { img.src = preload.src; img.style.opacity = '1'; };
              preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();

          const img = document.createElement('img');
          img.alt = ch.name;
          img.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();
          img.onerror = function() { this.style.opacity = '0.3'; };
          img.onload = function() { this.style.opacity = '1'; };
          cell.appendChild(img);

          const timer = setInterval(() => {
            const preload = new Image();
            preload.onload = () => {
              img.src = preload.src;
              img.style.opacity = '1';
            };
            preload.src = '/cctv/snapshot/' + activeDvrId + '/' + ch.ch_num + '?t=' + Date.now();

        forceFallback: true,

        onEnd: function() {
          // Collect new order from all containers: top → grid → bottom
          const allCells = [
            ...topRow.querySelectorAll('.cctv-cell'),
            ...grid.querySelectorAll('.cctv-cell'),
            ...bottomRow.querySelectorAll('.cctv-cell')

          const newOrder = allCells.map(c => parseInt(c.dataset.chnum));
          newOrder.forEach((num, i) => {

        if (el.children.length > 0 || el === grid) {

        }

      // Vertical sortable on mixed-right: reorder top row / Ops / bottom row
      const mixedRight = document.getElementById('mixedRight');
      if (window._mixedRightSortable) window._mixedRightSortable.destroy();
      window._mixedRightSortable = new Sortable(mixedRight, {
        animation: 300,

    }

    // Mixed Ops canvas (mirrors the main canvas region)
    let mixedCanvas, mixedCtx;
    let cropRegion = null; // {x, y, w, h} in source pixels
    let regionSelectActive = false;

    (function initMixedOps() {
      mixedCanvas = document.getElementById('mixedScreen');
      mixedCtx = mixedCanvas.getContext('2d');

      // Mirror Ops source (canvas or video) to mixed canvas every frame
      function mirrorLoop() {
        // Pick source: stream video if active, otherwise relay canvas
        let src = null;
        const video = document.getElementById('streamVideo');
        const canvas = document.getElementById('screen');

        if (streamMode && video && video.readyState >= 2 && video.videoWidth > 0) {
          src = video;
          var srcW = video.videoWidth, srcH = video.videoHeight;
        } else if (canvas && canvas.width > 0 && canvas.height > 0) {
          src = canvas;
          var srcW = canvas.width, srcH = canvas.height;
        }

        if (src) {
          if (cropRegion) {
            mixedCanvas.width = cropRegion.w;
            mixedCanvas.height = cropRegion.h;
            mixedCtx.drawImage(src, cropRegion.x, cropRegion.y, cropRegion.w, cropRegion.h, 0, 0, cropRegion.w, cropRegion.h);
          } else {
            if (mixedCanvas.width !== srcW || mixedCanvas.height !== srcH) {
              mixedCanvas.width = srcW;
              mixedCanvas.height = srcH;
            }
            mixedCtx.drawImage(src, 0, 0);
          }
        }
        requestAnimationFrame(mirrorLoop);
      }
      mirrorLoop();
    })();

      if (regionSelectActive) {

    function resetRegion() {
      cropRegion = null;
      document.getElementById('regionResetBtn').style.display = 'none';
      localStorage.removeItem('opsview_crop_region');
    }

    (function initRegionSelect() {
      const overlay = document.getElementById('regionOverlay');
      const rect = document.getElementById('regionRect');
      let startX, startY, isDragging = false;

      overlay.addEventListener('mousedown', e => {
        const bounds = overlay.getBoundingClientRect();
        startX = e.clientX - bounds.left;
        startY = e.clientY - bounds.top;
        isDragging = true;
        rect.style.left = startX + 'px';
        rect.style.top = startY + 'px';
        rect.style.width = '0';
        rect.style.height = '0';
        rect.style.display = 'block';
      });

      overlay.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const bounds = overlay.getBoundingClientRect();
        const curX = e.clientX - bounds.left;
        const curY = e.clientY - bounds.top;
        const x = Math.min(startX, curX);
        const y = Math.min(startY, curY);
        const w = Math.abs(curX - startX);
        const h = Math.abs(curY - startY);
        rect.style.left = x + 'px';
        rect.style.top = y + 'px';
        rect.style.width = w + 'px';
        rect.style.height = h + 'px';
      });

      overlay.addEventListener('mouseup', e => {
        if (!isDragging) return;
        isDragging = false;

        const bounds = overlay.getBoundingClientRect();
        const curX = e.clientX - bounds.left;
        const curY = e.clientY - bounds.top;

        const selX = Math.min(startX, curX);
        const selY = Math.min(startY, curY);
        const selW = Math.abs(curX - startX);
        const selH = Math.abs(curY - startY);

        if (selW > 10 && selH > 10) {
          // Get source dimensions (video or canvas)
          const video = document.getElementById('streamVideo');
          const canvas = document.getElementById('screen');
          let srcW, srcH;
          if (streamMode && video && video.videoWidth > 0) {
            srcW = video.videoWidth;
            srcH = video.videoHeight;
          } else if (canvas && canvas.width > 0) {
            srcW = canvas.width;
            srcH = canvas.height;
          } else {
            srcW = bounds.width;
            srcH = bounds.height;
          }

          // Account for object-fit:contain letterboxing
          const containerW = bounds.width;
          const containerH = bounds.height;
          const srcRatio = srcW / srcH;
          const containerRatio = containerW / containerH;
          let renderW, renderH, offsetX, offsetY;
          if (srcRatio > containerRatio) {
            // Source wider → pillarboxed top/bottom
            renderW = containerW;
            renderH = containerW / srcRatio;
            offsetX = 0;
            offsetY = (containerH - renderH) / 2;
          } else {
            // Source taller → letterboxed left/right
            renderH = containerH;
            renderW = containerH * srcRatio;
            offsetX = (containerW - renderW) / 2;
            offsetY = 0;
          }

          // Map selection coords to source coords
          const scale = srcW / renderW;
          cropRegion = {
            x: Math.max(0, Math.round((selX - offsetX) * scale)),
            y: Math.max(0, Math.round((selY - offsetY) * scale)),
            w: Math.min(srcW, Math.round(selW * scale)),
            h: Math.min(srcH, Math.round(selH * scale))
          };
          // Clamp to source bounds
          cropRegion.x = Math.min(cropRegion.x, srcW - cropRegion.w);
          cropRegion.y = Math.min(cropRegion.y, srcH - cropRegion.h);
          if (cropRegion.x < 0) cropRegion.x = 0;
          if (cropRegion.y < 0) cropRegion.y = 0;

          localStorage.setItem('opsview_crop_region', JSON.stringify(cropRegion));
          document.getElementById('regionResetBtn').style.display = 'inline-block';
        }

        rect.style.display = 'none';
        toggleRegionSelect(); // Exit select mode
      });

      // Restore saved crop region
      const saved = localStorage.getItem('opsview_crop_region');
      if (saved) {
        try {
          cropRegion = JSON.parse(saved);
          document.getElementById('regionResetBtn').style.display = 'inline-block';
        } catch(e) {}
      }
    })();

    let currentLang = localStorage.getItem('opsview_lang') || navigator.language.slice(0,2) || 'en';
    if (!i18n[currentLang]) currentLang = 'en';

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || i18n['en'][key] || key;
    }

    function applyI18n() {
      // Auto-apply data-i18n attributes
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
      });
      // Dynamic elements
      if (!pendingUpdate) {
        document.getElementById('settingsUpdateMsg').textContent = t('upToDate');
      }
    }

    function changeLang(lang) {
      currentLang = lang;
      localStorage.setItem('opsview_lang', lang);
      applyI18n();
      if (typeof loadDVRs === 'function') loadDVRs();
    }

    // ── Settings overlay ──
    function openSettings() {
      const overlay = document.getElementById('settingsOverlay');
      document.getElementById('langSelect').value = currentLang;
      // Load auto-start state
      try {
        window.go.main.App.GetAutoStart().then(v => {
          document.getElementById('autoStartToggle').checked = !!v;
        }).catch(() => {});
      } catch(e) {}
      if (pendingUpdate) {
        document.getElementById('settingsUpdateStatus').style.display = 'none';
        document.getElementById('settingsUpdateAvailable').style.display = 'block';
      }
      const verEl = document.getElementById('settingsVersion');
      if (pendingUpdate) verEl.textContent = 'v' + pendingUpdate.current_ver;
      overlay.style.display = 'flex';
      applyI18n();
      lucide.createIcons();
    }

    function toggleAutoStart(checked) {
      try {
        window.go.main.App.SetAutoStart(checked).catch(err => {
          console.error('SetAutoStart failed:', err);
          document.getElementById('autoStartToggle').checked = !checked;
        });
      } catch(e) {
        document.getElementById('autoStartToggle').checked = !checked;
      }
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').style.display = 'none';
    }

    document.getElementById('settingsOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'settingsOverlay') closeSettings();
    });

    // ── Update ──
    let pendingUpdate = null;

    async function checkUpdate() {
      if (!UPD()) return;
      try {
        const info = await UPD().CheckForUpdate();
        if (info && info.available) {
          pendingUpdate = info;
          const msg = t('newVersion').replace('{ver}', info.latest_ver).replace('{cur}', info.current_ver);
          document.getElementById('settingsNewVer').textContent = msg;
          document.getElementById('settingsUpdateStatus').style.display = 'none';
          document.getElementById('settingsUpdateAvailable').style.display = 'block';
          document.getElementById('settingsVersion').textContent = 'v' + info.current_ver;
          
          // Show the premium left-bottom auto-update toast
          showUpdateToast(info);
        } else if (info) {
          document.getElementById('settingsVersion').textContent = 'v' + info.current_ver;
        }
      } catch(e) { console.log('update check:', e); }
    }

    function showUpdateToast(info) {
      const toast = document.getElementById('updateToast');
      if (!toast) return;
      
      const verInfo = document.getElementById('toastVerInfo');
      const msgInfo = document.getElementById('toastMsg');
      
      let updateMsg = "최신 버전을 사용할 수 있습니다. 지금 업데이트를 진행하시겠습니까?";
      if (currentLang === 'en') updateMsg = "A new version is available. Would you like to update now?";
      else if (currentLang === 'ja') updateMsg = "最新バージョンが利用可能です。今すぐアップデートしますか？";
      else if (currentLang === 'pt') updateMsg = "Uma nova versão está disponível. Deseja atualizar agora?";
      else if (currentLang === 'es') updateMsg = "Una nueva versión está disponible. ¿Desea actualizar ahora?";
      
      if (msgInfo) msgInfo.textContent = updateMsg;
      if (verInfo) verInfo.textContent = `v${info.current_ver} ➔ v${info.latest_ver}`;
      
      // Reset Toast States
      document.getElementById('toastActionArea').style.display = 'flex';
      document.getElementById('toastProgressArea').style.display = 'none';
      document.getElementById('toastProgressBar').style.width = '0%';
      document.getElementById('toastProgressPercent').textContent = '0%';
      
      // Slide-in Animation
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      toast.style.pointerEvents = 'auto';
      
      lucide.createIcons();
    }

    function dismissUpdateToast() {
      const toast = document.getElementById('updateToast');
      if (!toast) return;
      toast.style.transform = 'translateY(120%)';
      toast.style.opacity = '0';
      toast.style.pointerEvents = 'none';
    }

    async function startToastUpdate() {
      if (!pendingUpdate || !UPD()) return;
      
      document.getElementById('toastActionArea').style.display = 'none';
      document.getElementById('toastProgressArea').style.display = 'block';
      
      const statusText = document.getElementById('toastProgressStatus');
      statusText.textContent = currentLang === 'ko' ? '다운로드 중...' : 'Downloading...';
      statusText.style.color = '';
      
      try {
        const msg = await UPD().DownloadAndInstall(pendingUpdate.download_url);
        // Will close app on Windows/Mac, but if returns
        statusText.textContent = msg || (currentLang === 'ko' ? '완료!' : 'Done!');
      } catch(e) {
        statusText.textContent = (currentLang === 'ko' ? '오류: ' : 'Error: ') + e;
        statusText.style.color = '#ef4444';
        document.getElementById('toastActionArea').style.display = 'flex';
      }
    }

    async function doUpdate() {
      if (!pendingUpdate || !UPD()) return;
      closeSettings();
      showUpdateToast(pendingUpdate);
      startToastUpdate();
    }

    // Bind real-time progress update event from Wails
    if (window.runtime) {
      window.runtime.EventsOn("update-download-progress", (percent) => {
        const rounded = Math.round(percent);
        const bar = document.getElementById('toastProgressBar');
        const percentText = document.getElementById('toastProgressPercent');
        const statusText = document.getElementById('toastProgressStatus');
        
        if (bar) bar.style.width = rounded + '%';
        if (percentText) percentText.textContent = rounded + '%';
        
        if (rounded >= 100 && statusText) {
          statusText.textContent = currentLang === 'ko' ? '설치 및 종료 중...' : 'Installing and relaunching...';
        }
      });
    }

    // Check for updates 3s after launch
    setTimeout(checkUpdate, 3000);
    // Periodically auto-detect update every 30 minutes
    setInterval(checkUpdate, 30 * 60 * 1000);

    // Apply i18n on load
    applyI18n();

    // Init CCTV
    loadDVRs();

    // Surveillance config from agent (via relay WebSocket)
    document.addEventListener('surv-config-updated', async (e) => {
      const cfg = e.detail;
      if (!cfg) return;
      console.log('[surv] remote config:', cfg.dvrs?.length, 'DVRs,', cfg.channels?.length, 'channels');
      window.survRemoteConfig = cfg;

      const remoteDvrs = [];
      let localAdded = false;

      applyAgentIdsToLocalDvrs(cfg);

      for (const d of (cfg.dvrs || [])) {
        const existsLocally = dvrs.some(ld => !ld._remote && ld.addr === d.addr && ld.port === d.port);
        if (existsLocally) {
          console.log('[surv] DVR', d.name, 'mapped to local entry (agent_id)');
          continue;
        }

        // Try to register locally if Go backend is available
        if (CM()) {
          try {
            const localDvr = await CM().AddDVR(d.name, d.addr, d.port, d.ext_addr || '', d.ext_port || 0, d.username, d.password, d.protocol || 'rtsp');
            await CM().UpdateDVR(localDvr.id, d.name, d.addr, d.port, d.ext_addr || '', d.ext_port || 0, d.username, d.password,
              d.refresh_rate || 2000, d.stream_quality || 'sub', d.protocol || 'rtsp');
            // Test if DVR is reachable by discovering channels
            const chs = await CM().DiscoverChannels(localDvr.id);
            if (chs && chs.length > 0) {
              console.log('[surv] DVR', d.name, 'reachable locally:', chs.length, 'channels');
              localAdded = true;
              continue; // registered as local DVR successfully
            }
            // Not reachable: remove the local entry
            await CM().DeleteDVR(localDvr.id);
            console.log('[surv] DVR', d.name, 'not reachable locally, using relay');
          } catch(err) {
            console.log('[surv] DVR', d.name, 'local registration failed, using relay:', err);
          }
        }

        // Fallback: treat as remote (HLS via relay)
        remoteDvrs.push({ ...d, _remote: true });
      }

      // Reload local DVRs if any were added
      if (localAdded && CM()) {
        try { dvrs = await CM().ListDVRs() || []; } catch(e) {}
      }

      // Merge: remove old remote DVRs, add new remote ones
      dvrs = dvrs.filter(d => !d._remote).concat(remoteDvrs);
      applyAgentIdsToLocalDvrs(cfg);
      renderDVRTabs();

      // Re-evaluate playback for active local DVR (LAN vs relay)
      const active = dvrs.find(d => d.id === activeDvrId);
      if (active && !active._remote) {
        await refreshDvrReachability(active);
        renderDVRTabs();
        selectDVR(activeDvrId);
      } else if (!activeDvrId || !dvrs.find(d => d.id === activeDvrId)) {
        if (dvrs.length > 0) selectDVR(dvrs[0].id);
      }
    });
  </script>
