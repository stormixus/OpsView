<?xml version="1.0" encoding="UTF-8"?>
<!-- macOS asset: identical to icon-dark.svg (OS applies mask). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpsView">
  <defs>
    <linearGradient id="bgBase" x1="512" y1="64" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e2838"/>
