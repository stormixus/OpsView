    <radialGradient id="bgGlow" cx="512" cy="280" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a3d52" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#141c28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ecae6" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#4a6a82" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a1018" stop-opacity="0"/>
