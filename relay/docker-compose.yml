services:
  relay:
    container_name: OpsView-relay
    image: ghcr.io/stormixus/opsview-relay:latest
    # GPU passthrough for NVENC transcode-live (opt-in). On Unraid with the Nvidia
    # plugin, set RELAY_RUNTIME=nvidia in relay/.env. Default runc = no GPU, normal
    # behavior. NVIDIA_VISIBLE_DEVICES must also be set (e.g. all) for the GPU to
    # actually appear inside the container.
    runtime: ${RELAY_RUNTIME:-runc}
    ports:
      - "${RELAY_EXTERNAL_PORT:-28186}:8080"
    environment:
      - RELAY_PORT=8080
      # Local timezone for the venue. Recordings are named + timeline-positioned
      # in this zone, so it MUST match the operator's browser (KST by default).
      # Without it the container runs UTC and the 녹화 timeline is shifted.
      - TZ=${TZ:-Asia/Seoul}
      # REQUIRED shared publisher secret — must match the agent's
      # RELAY_PUBLISHER_TOKEN/AGENT_TOKEN. Put the value in relay/.env
      # (see relay/.env.example). Compose errors out early if it's unset.
      - RELAY_PUBLISHER_TOKEN=${RELAY_PUBLISHER_TOKEN:?set RELAY_PUBLISHER_TOKEN in relay/.env}
      # Optional WebSocket Origin allowlist (comma-separated); empty = allow all.
      - RELAY_ALLOWED_ORIGINS=${RELAY_ALLOWED_ORIGINS:-}
      # Optional operator dashboard. Set to enable /dashboard (admin password).
      # Empty = dashboard disabled (routes return 404). Avoid # and $ in the
      # value — they are special in .env/compose.
      - RELAY_DASHBOARD_TOKEN=${RELAY_DASHBOARD_TOKEN:-}
      # Optional multi-tenant agent registry (JSON array of {id,name,token}).
      # Empty = single "default" agent (legacy, authed by RELAY_PUBLISHER_TOKEN).
      # When RELAY_DB is set, this only SEEDS the DB once; manage agents in the
      # dashboard afterward.
      - RELAY_AGENTS=${RELAY_AGENTS:-}
      # Persistent SQLite for the tenant registry — required to add/remove
      # 지점 from the dashboard. Stored on the relay-data volume below.
      - RELAY_DB=${RELAY_DB:-/data/relay.db}
      # Optional NVR recording. Set RELAY_REC_DIR=/rec to record every active
      # stream to MP4 segments (opt-in; empty = off). RELAY_REC_MAX caps disk use
      # (e.g. "2TB", "500GB") — oldest segments are deleted past the cap.
      # On Unraid, bind /rec to a big share via RELAY_REC_HOST (see volumes).
      - RELAY_REC_DIR=${RELAY_REC_DIR:-}
      - RELAY_REC_MAX=${RELAY_REC_MAX:-}
      # Optional license-plate OCR (ONNX, in-process). Off unless RELAY_LPR=1.
      # Models default to /data/lpr/models — run relay/lpr/fetch_models.sh once on
      # the host and bind that dir via RELAY_LPR_MODELS_HOST on Unraid.
      - RELAY_LPR=${RELAY_LPR:-}
      - ORT_LIB_PATH=${ORT_LIB_PATH:-/usr/local/lib/libonnxruntime.so}
      - RELAY_LPR_DETECTOR=${RELAY_LPR_DETECTOR:-/data/lpr/models/plate-detector.onnx}
      - RELAY_LPR_OCR=${RELAY_LPR_OCR:-/data/lpr/models/plate-ocr.onnx}
      - RELAY_LPR_OCR_CONFIG=${RELAY_LPR_OCR_CONFIG:-/data/lpr/models/plate-ocr.yaml}
      - RELAY_LPR_DET_CONF=${RELAY_LPR_DET_CONF:-}
      - RELAY_LPR_MIN_CONF=${RELAY_LPR_MIN_CONF:-}
      # Experimental NVENC transcode-live: for the named DVR (numeric id or its
      # LAN IP, e.g. 192.168.0.169), HD channels pull ONLY the main stream and the
      # relay GPU-downscales it for the live grid — halving DVR connections. Empty
      # = off. Requires RELAY_RUNTIME=nvidia + NVIDIA_VISIBLE_DEVICES below.
      - RELAY_TRANSCODE_DVR=${RELAY_TRANSCODE_DVR:-}
      # Experimental live wall: relay GPU-composites all of an agent's channels
      # into ONE stream at /dashboard/wall (viewer decodes 1 video — no browser
      # decoder cap). Requires RELAY_RUNTIME=nvidia + NVIDIA_VISIBLE_DEVICES.
      - RELAY_WALL=${RELAY_WALL:-}
      - RELAY_WALL_RES=${RELAY_WALL_RES:-1080p}
      - RELAY_WALL_FPS=${RELAY_WALL_FPS:-15}
      # Exposed to the container only when RELAY_RUNTIME=nvidia. Set to "all" (or a
      # GPU UUID) in relay/.env; capabilities need video+compute for NVENC+CUDA.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
    volumes:
      - relay-data:/data
      # Recordings live here. Default = a docker volume; on Unraid set
      # RELAY_REC_HOST=/mnt/user/<share> in relay/.env to use a real disk.
      - ${RELAY_REC_HOST:-relay-rec}:/rec
      # LPR ONNX models (read-only). On Unraid:
      #   RELAY_LPR_MODELS_HOST=/mnt/user/appdata/opsview/lpr-models
      - ${RELAY_LPR_MODELS_HOST:-relay-lpr-models}:/data/lpr/models:ro
    restart: unless-stopped

  # NOTE: the Cloudflare Tunnel is run separately on Unraid (the standalone
  # "Cloudflared Tunnel" app), routing ops.hotelpos.net -> http://192.168.0.197:28186.
  # So no cloudflared service is defined here anymore.

volumes:
  relay-data:
  relay-rec:
  relay-lpr-models:
