services:
  relay:
    container_name: OpsView-relay
    image: ghcr.io/stormixus/opsview-relay:latest
    ports:
      - "${RELAY_EXTERNAL_PORT:-28186}:8080"
    environment:
      - RELAY_PORT=8080
      # REQUIRED shared publisher secret — must match the agent's
      # RELAY_PUBLISHER_TOKEN/AGENT_TOKEN. Put the value in relay/.env
      # (see relay/.env.example). Compose errors out early if it's unset.
      - RELAY_PUBLISHER_TOKEN=${RELAY_PUBLISHER_TOKEN:?set RELAY_PUBLISHER_TOKEN in relay/.env}
      # Optional WebSocket Origin allowlist (comma-separated); empty = allow all.
      - RELAY_ALLOWED_ORIGINS=${RELAY_ALLOWED_ORIGINS:-}
      # Optional operator dashboard. Set to enable /dashboard (admin password).
      # Empty = dashboard disabled (routes return 404). Avoid # and $ in the
      # value — they are special in .env/compose.
      - RELAY_DASHBOARD_TOKEN=${RELAY_DASHBOARD_TOKEN:-}
      # Optional multi-tenant agent registry (JSON array of {id,name,token}).
      # Empty = single "default" agent (legacy, authed by RELAY_PUBLISHER_TOKEN).
      # When RELAY_DB is set, this only SEEDS the DB once; manage agents in the
      # dashboard afterward.
      - RELAY_AGENTS=${RELAY_AGENTS:-}
      # Persistent SQLite for the tenant registry — required to add/remove
      # 지점 from the dashboard. Stored on the relay-data volume below.
      - RELAY_DB=${RELAY_DB:-/data/relay.db}
      # Optional NVR recording. Set RELAY_REC_DIR=/rec to record every active
      # stream to MP4 segments (opt-in; empty = off). RELAY_REC_MAX caps disk use
      # (e.g. "2TB", "500GB") — oldest segments are deleted past the cap.
      # On Unraid, bind /rec to a big share via RELAY_REC_HOST (see volumes).
      - RELAY_REC_DIR=${RELAY_REC_DIR:-}
      - RELAY_REC_MAX=${RELAY_REC_MAX:-}
    volumes:
      - relay-data:/data
      # Recordings live here. Default = a docker volume; on Unraid set
      # RELAY_REC_HOST=/mnt/user/<share> in relay/.env to use a real disk.
      - ${RELAY_REC_HOST:-relay-rec}:/rec
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the relay over TLS (wss/https) at your domain with
  # no port-forwarding. OPT-IN via a compose profile so plain `docker compose up`
  # is unaffected for LAN-only deployments. To enable, set in relay/.env:
  #   COMPOSE_PROFILES=tunnel
  #   CLOUDFLARE_TUNNEL_TOKEN=<token from Cloudflare Zero Trust>
  # Then add a Public Hostname  ops.hotelpos.net -> http://relay:8080  in the
  # Cloudflare dashboard (same compose network, so the name `relay` resolves).
  cloudflared:
    profiles: ["tunnel"]
    container_name: OpsView-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - relay

volumes:
  relay-data:
  relay-rec:
